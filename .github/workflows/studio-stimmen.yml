name: Studio-Stimmen

# Sammelt alle festen Sätze der App und vertont neue mit Azure Speech.
# Läuft nur auf entwicklung, main bekommt die Aufnahmen per Fast-Forward.

on:
  push:
    branches: [entwicklung]
    paths:
      - "YEM1N/**"
      - "stimmen/**"
      - ".github/workflows/studio-stimmen.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: studio-stimmen
  cancel-in-progress: false

jobs:
  vertonen:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: entwicklung

      - name: Swift vorhanden?
        id: swift
        run: |
          if command -v swiftc >/dev/null; then echo "da=ja" >> "$GITHUB_OUTPUT"; else echo "da=nein" >> "$GITHUB_OUTPUT"; fi

      - name: Swift einrichten
        if: steps.swift.outputs.da == 'nein'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"

      - name: Sätze sammeln
        run: stimmen/sammeln/sammeln.sh

      - name: Vertonen
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: python3 stimmen/vertonen.py

      - name: Speichern
        run: |
          git config user.name "YEM1N Stimmen"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stimmen/saetze YEM1N/Studio
          if git diff --cached --quiet; then
            echo "Nichts Neues"
            exit 0
          fi
          git commit -m "Studio-Stimmen aktualisiert"
          for i in 1 2 3; do
            git pull --rebase origin entwicklung && git push origin HEAD:entwicklung && exit 0
            sleep 10
          done
          exit 1
