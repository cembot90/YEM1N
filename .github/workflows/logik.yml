name: Logik prüfen

# Übersetzt die Logik ohne Oberfläche unter Linux und lässt ihre Tests laufen.
# Ersetzt nicht den Build in Xcode Cloud, findet aber Fehler schon auf entwicklung.

on:
  push:
    branches: [entwicklung]
    paths:
      - "YEM1N/**"
      - "YEM1NTests/**"
      - "pruefen/**"
  workflow_dispatch:

# Der Lauf braucht nur Lesezugriff auf den Code.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Swift vorhanden?
        id: swift
        run: |
          if command -v swiftc >/dev/null; then echo "da=ja" >> "$GITHUB_OUTPUT"; else echo "da=nein" >> "$GITHUB_OUTPUT"; fi

      - name: Swift einrichten
        if: steps.swift.outputs.da == 'nein'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"

      - name: Tests
        run: |
          swiftc --version
          set +e
          pruefen/linux-tests.sh > ausgabe.txt 2>&1
          rc=$?
          cat ausgabe.txt
          # Fehler zusätzlich als Hinweis ausgeben, damit sie auch ohne Log-Download lesbar sind
          if [ $rc -ne 0 ]; then
            fehler=$(grep -E "error:|✘|recorded an issue|Fatal error|Test run with" ausgabe.txt | head -40 | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Logik-Prüfung::${fehler}"
          fi
          exit $rc
