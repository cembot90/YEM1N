<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>YEM1N Anmeldung</title>
<style>
  body { margin:0; font-family: -apple-system, system-ui, Roboto, sans-serif; background:#00205B; color:#fff;
         display:flex; min-height:100vh; align-items:center; justify-content:center; text-align:center; padding:24px; }
  main { max-width:420px; }
  h1 { color:#FFED00; font-size:28px; margin:0 0 12px; }
  p { font-size:17px; line-height:1.45; }
  a.knopf { display:inline-block; margin-top:16px; padding:14px 26px; border-radius:30px; background:#FFED00;
            color:#00205B; font-weight:700; text-decoration:none; font-size:18px; }
</style>
</head>
<body>
<main>
  <h1 id="titel">Anmeldung klappt</h1>
  <p id="text">Du wirst gleich zurück in die YEM1N-App geleitet.</p>
  <a class="knopf" id="knopf" href="#" hidden>Zurück zur App</a>
  <p style="font-size:13px;opacity:.7">Diese Seite speichert nichts. Der Anmelde-Schlüssel geht nur an die App auf diesem Gerät.</p>
</main>
<script>
  // Apple hängt nach der Anmeldung ?ckWebAuthToken=... an diese Adresse. Wir geben ihn an die Android-App weiter.
  // Von Hand lesen: URLSearchParams würde ein "+" im Schlüssel in ein Leerzeichen verwandeln.
  var m = /[?&]ckWebAuthToken=([^&#]*)/.exec(location.search);
  var t = m ? decodeURIComponent(m[1]) : null;
  var k = document.getElementById('knopf');
  if (t) {
    var ziel = 'yem1n://cloudkit?ckWebAuthToken=' + encodeURIComponent(t);
    k.href = ziel;
    k.hidden = false;
    location.replace(ziel);
  } else {
    document.getElementById('titel').textContent = 'Das hat nicht geklappt';
    document.getElementById('text').textContent = 'Es kam kein Anmelde-Schlüssel an. Geh zurück in die App und versuche es noch einmal.';
  }
</script>
</body>
</html>
